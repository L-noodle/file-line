[package]
name = "file-line"
version = "1.2.0"
description = "晾衣绳 — 屏幕顶部的晾衣绳挂件（Windows）"
authors = ["you"]
edition = "2021"

[lib]
name = "file_line_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-drag = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
chrono = "0.4"

[target."cfg(windows)".dependencies]
# filedrop / textdrag 里的 #[implement(...)] 宏展开引用 windows_core 路径，
# 必须是直接依赖才在 extern prelude 里
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

[target."cfg(target_os = \"macos\")".dependencies]
# macOS 原生调用（NSPasteboard / NSEvent）仅用 objc 直接 FFI，无需额外框架链接
objc = "0.2"

# objc 0.2 的 msg_send! 宏展开内部用 cfg(feature = "cargo-clippy") 检测 clippy 运行，
# 该 crate 自身未声明此 feature，Rust 1.80+ 的 unexpected_cfgs lint 会对每次宏调用报警告
# （本项目 macOS 侧大量 msg_send! 调用，噪声数十条）。在此声明为已知合法值，消除噪声。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.dev]
incremental = true
